<!DOCTYPE html>

<html>

<head>

    <title>IoT Secure Login</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        body {

            background: #050505;

            color: #00ff9c;

            font-family: Arial, sans-serif;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .login-container {

            background: #101010;

            padding: 40px;

            border: 1px solid #00ff9c;

            border-radius: 15px;

            width: 350px;

            box-shadow: 0 0 25px #00ff9c44;

        }

        h2 {

            text-align: center;

            margin-bottom: 25px;

            letter-spacing: 2px;

        }

        input {

            width: 100%;

            padding: 12px;

            margin: 12px 0;

            background: #050505;

            border: 1px solid #00ff9c;

            color: white;

            border-radius: 5px;

            outline: none;

        }

        input:focus {

            box-shadow: 0 0 10px #00ff9c;

        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            background: #00ff9c;

            border: none;

            color: black;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;

        }

        button:hover {

            background: #00cc7a;

            box-shadow: 0 0 15px #00ff9c;

        }

        .status {

            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #888;

        }

    </style>

</head>

<body>

    <div class="login-container">

        <h2>IoT Secure Login</h2>

        <input type="text" id="username"

               placeholder="Username">

        <input type="password" id="password"

               placeholder="Password">

        <button onclick="login()">LOGIN</button>

        <div class="status">

            SYSTEM SECURE | AUTHENTICATION ACTIVE

        </div>

    </div>

    <script>

        function login() {

            let user = document.getElementById("username").value;

            let pass = document.getElementById("password").value;

            if (user === "admin" && pass === "1234") {

                alert("Authentication Successful!");

            } else {

                alert("Authentication Failed!");

            }

        }

    </script>

</body>

</html>
